<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satoru Gojo - The Strongest</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #050508;
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        /* Dynamic Infinity Background Particles */
        .infinity-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            background: rgba(0, 243, 255, 0.4);
            border-radius: 50%;
            box-shadow: 0 0 10px #00f3ff, 0 0 20px #00f3ff;
            animation: floatAround linear infinite;
        }

        @keyframes floatAround {
            0% {
                transform: translate(0, 0) scale(0.5);
                opacity: 0;
            }

            50% {
                opacity: 0.8;
            }

            100% {
                transform: translate(var(--tx), var(--ty)) scale(1.2);
                opacity: 0;
            }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 2;
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px 120px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Header Styling with Blue Shine Effect */
        h1 {
            font-size: 3.5rem;
            letter-spacing: 4px;
            margin-bottom: 20px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 10px #00f3ff, 0 0 20px #00f3ff, 0 0 40px #0066ff, 0 0 80px #0066ff;
            animation: blueShinePulse 3s ease-in-out infinite alternate;
        }

        @keyframes blueShinePulse {
            0% {
                text-shadow: 0 0 10px #00f3ff, 0 0 20px #00f3ff, 0 0 30px #0066ff;
                transform: scale(1);
            }

            100% {
                text-shadow: 0 0 20px #00f3ff, 0 0 40px #00f3ff, 0 0 60px #00ffff, 0 0 90px #0044ff;
                transform: scale(1.02);
            }
        }

        /* Introduction Paragraph */
        .intro-text {
            font-size: 1.15rem;
            line-height: 1.8;
            color: #d0d0ff;
            max-width: 800px;
            margin-bottom: 40px;
            background: rgba(10, 15, 35, 0.7);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 102, 255, 0.2);
        }

        /* Gojo Character Visual & Automated Defense Shield Area */
        .character-viewport {
            position: relative;
            width: 280px;
            height: 380px;
            margin: 10px auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Automated Defense Shield Effect */
        .defense-shield {
            position: absolute;
            width: 340px;
            height: 340px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 243, 255, 0.05) 0%, rgba(0, 102, 255, 0.15) 70%, rgba(0, 0, 255, 0.3) 100%);
            border: 2px solid rgba(0, 243, 255, 0.6);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.4), inset 0 0 30px rgba(0, 243, 255, 0.4);
            animation: shieldPulse 4s ease-in-out infinite alternate, shieldRotate 20s linear infinite;
            pointer-events: none;
            z-index: 3;
        }

        @keyframes shieldPulse {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 20px rgba(0, 243, 255, 0.3), inset 0 0 20px rgba(0, 243, 255, 0.3);
            }

            100% {
                transform: scale(1.05);
                box-shadow: 0 0 50px rgba(0, 243, 255, 0.8), inset 0 0 50px rgba(0, 243, 255, 0.8);
            }
        }

        @keyframes shieldRotate {
            0% {
                transform: rotate(0deg) scale(1);
            }

            50% {
                transform: rotate(180deg) scale(1.03);
            }

            100% {
                transform: rotate(360deg) scale(1);
            }
        }

        /* Infinitely Approaching/Stopping Objects (Infinity Concept) */
        .infinity-object {
            position: absolute;
            width: 16px;
            height: 16px;
            background: #ff3366;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff3366, 0 0 20px #ff3366;
            z-index: 4;
            animation: infinitySlowdown 3s cubic-bezier(0, .9, .1, 1) infinite;
        }

        .io-1 {
            top: -20px;
            left: 50%;
            animation-delay: 0s;
        }

        .io-2 {
            bottom: -20px;
            left: 20%;
            animation-delay: 1s;
        }

        .io-3 {
            top: 40%;
            right: -20px;
            animation-delay: 2s;
        }

        @keyframes infinitySlowdown {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }

            70% {
                transform: translate(calc(var(--end-x, 0px) * 0.75), calc(var(--end-y, 80px) * 0.75)) scale(0.8);
                opacity: 0.9;
            }

            100% {
                transform: translate(calc(var(--end-x, 0px) * 0.8), calc(var(--end-y, 80px) * 0.8)) scale(0.3);
                opacity: 0;
            }
        }

        /* Gojo Character Image with Body Movement */
        .gojo-img {
            width: 240px;
            height: 340px;
            object-fit: cover;
            border-radius: 15px;
            border: 3px solid #00f3ff;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.5);
            z-index: 2;
            animation: bodyFloat 4s ease-in-out infinite alternate;
            position: relative;
            transition: filter 0.3s ease;
        }

        @keyframes bodyFloat {
            0% {
                transform: translateY(0px) rotate(0deg);
            }

            100% {
                transform: translateY(-12px) rotate(1deg);
            }
        }

        /* Interactive Abilities Sections */
        .abilities-section {
            width: 100%;
            margin-top: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .ability-card {
            background: rgba(15, 20, 40, 0.85);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
        }

        .ability-card:hover {
            border-color: #00f3ff;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.4);
            transform: translateY(-5px);
        }

        .ability-card h3 {
            font-size: 1.4rem;
            color: #00f3ff;
            margin-bottom: 15px;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.5);
        }

        .ability-content {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #c5c5e0;
            margin-bottom: 20px;
            text-align: left;
        }

        .ability-content ul {
            list-style-type: none;
            padding-left: 0;
        }

        .ability-content li {
            margin-bottom: 12px;
            position: relative;
            padding-left: 18px;
        }

        .ability-content li::before {
            content: "•";
            color: #00f3ff;
            position: absolute;
            left: 0;
            font-weight: bold;
            font-size: 1.2rem;
        }

        /* Action Buttons */
        .action-btn {
            background: linear-gradient(135deg, #0066ff, #00f3ff);
            color: #000;
            font-weight: bold;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background: linear-gradient(135deg, #00f3ff, #ffffff);
            box-shadow: 0 0 25px #00f3ff;
            transform: scale(1.03);
        }

        .action-btn:active {
            transform: scale(0.97);
        }

        /* Fixed Bottom Access Button */
        .bottom-access-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(5, 5, 12, 0.9);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(0, 243, 255, 0.4);
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            box-shadow: 0 -5px 25px rgba(0, 0, 0, 0.8);
        }

        .master-btn {
            background: linear-gradient(135deg, #9900ff, #00f3ff);
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 14px 35px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 25px rgba(153, 0, 255, 0.6);
            transition: all 0.3s ease;
        }

        .master-btn:hover {
            background: linear-gradient(135deg, #00f3ff, #9900ff);
            box-shadow: 0 0 35px #00f3ff, 0 0 35px #9900ff;
            transform: scale(1.05);
        }

        /* Screen Effect Overlay */
        .screen-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 99;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .screen-effect.active {
            opacity: 1;
        }

        /* Ability Visual Feedback Overlays */
        .ability-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            background: rgba(10, 15, 35, 0.95);
            border: 2px solid #00f3ff;
            padding: 30px 40px;
            border-radius: 15px;
            z-index: 1000;
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.8);
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .ability-popup.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .ability-popup h2 {
            color: #00f3ff;
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00f3ff;
        }

        .ability-popup p {
            color: #e0e0ff;
            font-size: 1.1rem;
        }
    </style>
</head>

<body>

    <!-- Background Infinity Animation Elements -->
    <div class="infinity-bg" id="infinityBg"></div>

    <!-- Screen Flash/Effect Layer -->
    <div class="screen-effect" id="screenEffect"></div>
